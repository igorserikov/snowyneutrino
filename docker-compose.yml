services:
  db:
    image: postgres:16.8
    environment:
      POSTGRES_DB: snowtrino
      POSTGRES_USER: snowtrino
      POSTGRES_PASSWORD: snowtrino
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snowtrino"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  web:
    build: .
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn snowtrino.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  worker:
    build: .
    env_file: .env
    command: python -m snowtrino.worker
    depends_on:
      db: {condition: service_healthy}
volumes:
  postgres_data:
