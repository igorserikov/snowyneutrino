services:
  db:
    image: postgres:16.8
    environment:
      POSTGRES_DB: snowtrino
      POSTGRES_USER: snowtrino
      POSTGRES_PASSWORD: snowtrino
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snowtrino"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  trino:
    image: trinodb/trino:455
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
  web:
    build: .
    env_file: .env
    environment:
      MOCK_TRINO_ENDPOINT: http://trino:8080
    command: sh -c "alembic upgrade head && uvicorn snowtrino.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      trino: {condition: service_started}
volumes:
  postgres_data:
