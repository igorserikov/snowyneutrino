services:
  db:
    image: postgres:16.8
    environment:
      POSTGRES_DB: snowtrino
      POSTGRES_USER: snowtrino
      POSTGRES_PASSWORD: snowtrino
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snowtrino"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  trino:
    image: trinodb/trino:455
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./trino/mock-catalog:/etc/trino/catalog:ro
    depends_on:
      db: {condition: service_healthy}
      iceberg-catalog-init: {condition: service_completed_successfully}
      object-store-init: {condition: service_completed_successfully}
      hive-metastore: {condition: service_healthy}
  iceberg-catalog-init:
    image: postgres:16.8
    entrypoint: ["psql"]
    command: ["-h", "db", "-U", "snowtrino", "-d", "snowtrino", "-v", "ON_ERROR_STOP=1", "-f", "/init.sql"]
    environment:
      PGPASSWORD: snowtrino
    volumes:
      - ./trino/init/iceberg-catalog.sql:/init.sql:ro
    depends_on:
      db: {condition: service_healthy}
  rustfs:
    image: rustfs/rustfs:latest
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
  object-store-init:
    image: public.ecr.aws/aws-cli/aws-cli:2.36.44
    entrypoint: ["/bin/sh", "-c"]
    command: ["until aws --endpoint-url http://rustfs:9000 s3api list-buckets >/dev/null 2>&1; do sleep 2; done; if ! aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket warehouse >/dev/null 2>&1; then aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket warehouse; fi"]
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    depends_on:
      rustfs:
        condition: service_healthy
  hive-metastore-data-init:
    image: apache/hive:4.0.0
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R hive:hive /data"]
    volumes:
      - hive_metastore_data:/data
  hive-metastore:
    image: apache/hive:4.0.0
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: derby
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      HADOOP_CLASSPATH: /opt/hadoop/share/hadoop/tools/lib/*
    volumes:
      - hive_metastore_data:/opt/hive/data/warehouse
      - ./trino/hive-metastore/hive-site.xml:/hive_custom_conf/hive-site.xml:ro
      - ./trino/hive-metastore/core-site.xml:/hive_custom_conf/core-site.xml:ro
    depends_on:
      hive-metastore-data-init:
        condition: service_completed_successfully
      object-store-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9083'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    environment:
      MOCK_TRINO_ENDPOINT: http://trino:8080
    command: sh -c "alembic upgrade head && uvicorn snowtrino.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      trino: {condition: service_started}
volumes:
  postgres_data:
  rustfs_data:
  hive_metastore_data:
