[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "snowtrino"
version = "0.1.0"
description = "A small control plane for Trino clusters"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12", "uvicorn[standard]==0.34.2", "sqlalchemy==2.0.40",
  "alembic==1.15.2", "psycopg[binary]==3.2.6", "jinja2==3.1.6",
  "python-multipart==0.0.20", "pydantic-settings==2.8.1", "trino==0.333.0"
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.8", "mypy==1.15.0"]

[tool.hatch.build.targets.wheel]
packages = ["snowtrino"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
